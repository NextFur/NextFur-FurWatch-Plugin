name: Dev Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew clean build --info

      - name: Find built JARs
        id: artifacts
        run: |
          mkdir -p release
          find build/libs -type f -name "*.jar" -exec cp {} release/ \;
          echo "artifacts=$(ls release/*.jar | xargs)" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        run: |
          cd release
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          echo "## 🚀 Release $(date +'%Y-%m-%d %H:%M:%S')" > release_notes.md
          echo "" >> release_notes.md
          echo "### ✅ Changes since last release:" >> release_notes.md
          git log -10 --pretty=format:"- %h %s (%an)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Artifacts (SHA256):" >> release_notes.md
          for f in release/*.sha256; do
            echo "- \`$(basename $f .sha256)\` → \`$(cut -d ' ' -f1 $f)\`" >> release_notes.md
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Auto Release #${{ github.run_number }}"
          body_path: release_notes.md
          files: |
            release/*.jar
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
