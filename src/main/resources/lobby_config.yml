
#
#  Este servidor está definido como lobby
#

# Dados para autenticação staff no furguard
FurGuard:
  ApiKey: ""
  ApiUrl: "https://api.nextfur.net/"

Messages:
  BannedItem: "§cOpa! Um item banido foi removido do seu inventário. §5[ x%amount% %item% ]"

# Configs do lobby
Lobby:
  SpawnPos: ""
  Disable-Hunger: true
  Disable-Damage: true
  Spawn-On-Join: true

# Módulo de rastreamento e anúncio de mortes
DeathTracker:
  Enabled: false
  Notify-Ops: false
  Permission: "furwatch.admin"
  Log-To-Console: false
  Messages:
    Death-Alert: "&8[&6FurWatch&8] &c%player% &7morreu! Causa: &f%death_message% &7| Mortes totais: &e%death_count% &7| Local: &f%world% &8(&f%x%&7, &f%y%&7, &f%z%&8)"

# Módulo de ações canônicas de roleplay (/acao, /action)
RoleplayAction:
  Enabled: true
  Radius: 15.0
  Duration-Seconds: 4
  Cooldown-Seconds: 2
  Custom-Format: "&e* &6%player% &f%action% &e*"
  Messages:
    No-One-Nearby: "&7(Ninguém por perto viu sua ação)"
    Usage: "&cUso: /acao <ação|preset> [alvo] &7- Digite &e/acao lista &7para ver presets."
    Cooldown: "&cAguarde %seconds%s para usar outra ação."
    Disabled: "&cO sistema de ações de roleplay está desativado."

# Módulo de barreiras dinâmicas e proteção de áreas (/guard)
Guard:
  Enabled: true
  Repulsion-Force: 0.35
  Notification-Type: "ACTION_BAR" # ACTION_BAR ou CHAT
  Particle-Effects: true
  Sound-Effects: true
  Messages:
    Blacklist-Entry: "&8[&6FurWatch&8] &cVocê não pode entrar nesta região restrita!"
    Whitelist-Exit: "&8[&6FurWatch&8] &cVocê não pode sair desta área protegida!"
    Block-Break: "&8[&6FurWatch&8] &cVocê não tem permissão para quebrar blocos aqui!"
    Block-Place: "&8[&6FurWatch&8] &cVocê não tem permissão para colocar blocos aqui!"
    Interact: "&8[&6FurWatch&8] &cVocê não tem permissão para interagir aqui!"
    PvP: "&8[&6FurWatch&8] &cO combate entre jogadores está desativado nesta região!"

Config-Version: 1.0
Server-Role: "lobby"