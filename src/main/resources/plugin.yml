name: FurWatch
version: '1.0'
main: net.nextfur.fws.bukkit.FurWatchBukkit
api-version: '1.21'
load: STARTUP
authors: [ NextFur ]
website: https://fursmp.com/
commands:
  setspawn:
    permission: "furwatch.admin"
  banitem:
    permission: "furwatch.admin"
  furwatch:
    permission: "furwatch.admin"
  sudo:
    permission: "furwatch.admin"
  fakejoin:
    permission: "furwatch.admin"
  fakeleave:
    permission: "furwatch.admin"
  deathcount:
    permission: "furwatch.admin"
    description: "Gerencia e visualiza as estatísticas de mortes dos jogadores"
    aliases: [deaths, deathstats]
  acao:
    description: "Executa uma ação canônica de roleplay visível para jogadores próximos"
    aliases: [action]
    usage: "/<command> <preset|ação personalizada> [alvo]"

permissions:
  furwatch.admin:
    default: op
    description: "Libera acesso aos comandos do furwatch"
  furwatch.action:
    default: true
    description: "Permite usar comandos de ação de roleplay /acao e /action"
  furwatch.action.color:
    default: op
    description: "Permite usar cores em ações de roleplay personalizadas"
  furwatch.action.bypass:
    default: op
    description: "Permite ignorar o cooldown de ações de roleplay"
