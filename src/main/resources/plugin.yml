name: FurWatch
version: '1.0'
main: net.nextfur.fws.bukkit.FurWatchBukkit
api-version: '1.21'
load: STARTUP
authors: [ NextFur ]
website: https://fursmp.com/
commands:
  setspawn:
    permission: "furwatch.admin"
  banitem:
    permission: "furwatch.admin"
  furwatch:
    permission: "furwatch.admin"
  sudo:
    permission: "furwatch.admin"
  fakejoin:
    permission: "furwatch.admin"
  fakeleave:
    permission: "furwatch.admin"
  deathcount:
    permission: "furwatch.admin"
    description: "Gerencia e visualiza as estatísticas de mortes dos jogadores"
    aliases: [deaths, deathstats]

permissions:
  furwatch.admin:
    default: op
    description: "Libera acesso aos comandos do furwatch"
